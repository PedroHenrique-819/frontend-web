<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pedido de Pizza</title>
</head>

<body>

    <header>
        <h1>Pedido de Pizza</h1>
    </header>

    <main>
        <section>
            <h2>Faça seu pedido</h2>

            <form action="https://postman-echo.com/post" method="post">

                <p>Preencha as informações para fazer seu pedido.</p>

                <fieldset>
                    <legend>Dados do cliente</legend>

                    <div>
                        <label for="nome_id">Nome:</label>
                        <input
                            id="nome_id"
                            name="nome"
                            type="text"
                            placeholder="João da Silva"
                            required
                        >
                    </div>

                    <div>
                        <label for="sobrenome_id">Sobrenome:</label>
                        <input
                            id="sobrenome_id"
                            name="sobrenome"
                            type="text"
                            placeholder="Pereira"
                        >
                    </div>

                    <div>
                        <label for="endereco_id">Endereço:</label>
                        <input
                            id="endereco_id"
                            name="endereco"
                            type="text"
                        >
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Pizza</legend>

                    <div>
                        <label for="sabor_id">Sabor:</label>
                        <select id="sabor_id" name="sabor">
                            <option value="calabresa">Calabresa</option>
                            <option value="mussarela">Mussarela</option>
                            <option value="frango">Frango com Catupiry</option>
                            <option value="portuguesa">Portuguesa</option>
                            <option value="chocolate">Chocolate</option>
                        </select>
                    </div>

                    <div>
                        <p>Tamanho:</p>

                        <input
                            id="pequena_id"
                            name="tamanho"
                            type="radio"
                            value="pequena"
                        >
                        <label for="pequena_id">Pequena</label>

                        <input
                            id="media_id"
                            name="tamanho"
                            type="radio"
                            value="media"
                        >
                        <label for="media_id">Média</label>

                        <input
                            id="grande_id"
                            name="tamanho"
                            type="radio"
                            value="grande"
                        >
                        <label for="grande_id">Grande</label>
                    </div>

                    <div>
                        <p>Adicionais:</p>

                        <input
                            id="bacon_id"
                            name="adicionais"
                            type="checkbox"
                            value="bacon"
                        >
                        <label for="bacon_id">Bacon</label>

                        <input
                            id="azeitona_id"
                            name="adicionais"
                            type="checkbox"
                            value="azeitona"
                        >
                        <label for="azeitona_id">Azeitona</label>
                    </div>

                    <div>
                        <label for="quantidade_id">Quantidade:</label>
                        <input
                            id="quantidade_id"
                            name="quantidade"
                            type="number"
                        >
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Pagamento</legend>

                    <div>
                        <label for="pagamento_id">Forma de pagamento:</label>
                        <select id="pagamento_id" name="pagamento">
                            <option value="pix">Pix</option>
                            <option value="cartao">Cartão</option>
                            <option value="dinheiro">Dinheiro</option>
                        </select>
                    </div>

                    <div>
                        <label for="troco_id">Precisa de troco?</label>
                        <input
                            id="troco_id"
                            name="troco"
                            type="checkbox"
                            value="sim"
                        >
                        <label for="troco_id">Sim</label>
                    </div>

                    <div>
                        <label for="observacao_id">Observação:</label>
                        <textarea
                            id="observacao_id"
                            name="observacao"
                            placeholder="Ex: Não colocar cebola"
                        ></textarea>
                    </div>

                </fieldset>

                <div>
                    <button type="reset">Limpar pedido</button>
                    <button type="submit">Enviar pedido</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>Obrigado pela preferência!</p>
    </footer>

</body>
</html>
